name: Supabase Keepalive

on:
  schedule:
    - cron: '0 3 */3 * *' # 每 3 天的 UTC 03:00（台灣時間約 11:00）執行一次
  workflow_dispatch:        # 允許在 Actions 頁籤手動觸發，方便測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/quiz_history?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
