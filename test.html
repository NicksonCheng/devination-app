    // 計算流年數字邏輯
    function calculatePersonalYearNumber(birthDateString) {
      const date = new Date(birthDateString);
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const currentYear = 2026;

      let sum = currentYear.toString() + month.toString() + day.toString();
      
      function reduceToSingleDigit(numStr) {
        let total = 0;
        for (let char of numStr) {
          total += parseInt(char, 10);
        }
        return total > 9 ? reduceToSingleDigit(total.toString()) : total;
      }

      return reduceToSingleDigit(sum);
    }

    // 開始分析並渲染
    function startAnalysis() {
      const birthInput = document.getElementById('birthdate').value;
      if (!birthInput) {
        alert('請先選擇您的出生年月日！');
        return;
      }

      const num = calculatePersonalYearNumber(birthInput);
      const data = numerologyData[num] || numerologyData[1];

      document.getElementById('res-year-num').innerText = data.yearNumText;
      document.getElementById('res-year-title').innerText = data.yearTitle;
      document.getElementById('res-element').innerText = data.element;
      document.getElementById('res-god').innerText = data.godName;
      document.getElementById('res-quote').innerText = data.quote;
      document.getElementById('res-desc').innerText = data.description;
      document.getElementById('res-challenge').innerText = data.challenge;
      document.getElementById('res-talent').innerText = data.talent;
      document.getElementById('res-action').innerText = data.action;
      document.getElementById('res-link').href = data.purchaseLink;

      // 渲染對應的 KPIA 80 香氣標籤
      const scentsContainer = document.getElementById('res-scents');
      scentsContainer.innerHTML = '';
      data.scents.forEach(scent => {
        const tag = document.createElement('span');
        tag.className = 'bg-[#F1EAD8] text-[#91634B] border border-[#A7A48F]/40 text-[11px] px-2.5 py-0.5 rounded-full font-sans';
        tag.innerText = scent;
        scentsContainer.appendChild(tag);
      });

      document.getElementById('step-input').classList.add('hidden');
      document.getElementById('step-result').classList.remove('hidden');
    }

    function resetQuiz() {
      document.getElementById('step-result').classList.add('hidden');
      document.getElementById('step-input').classList.remove('hidden');
